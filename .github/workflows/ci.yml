name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --workspaces --include-workspace-root
      - name: Browser API regression test
        run: node --test tests/browser-fetch.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Aurora Intents plan tests
        run: npm run aurora:test
      - name: Envio live observation tests
        run: npx --no-install tsx --test tests/envio-live.test.ts
      - name: Customer payment review, Nansen and live-graphics model tests
        run: npx --no-install tsx --test tests/payment-experience.test.ts tests/nansen-payment-intelligence.test.ts tests/transaction-live.test.ts tests/studio-geometry.test.ts
      - name: Build Expo web app
        env:
          EXPO_PUBLIC_AURORA_INTENTS_ENABLED: "true"
          EXPO_PUBLIC_AURORA_INTENTS_API_BASE_URL: "https://intents-connect-alpha-api.aurora.dev"
          EXPO_PUBLIC_AURORA_INTENTS_PROXY_URL: "https://cherrymoney.co.uk/api/aurora-intents/"
          EXPO_PUBLIC_AURORA_BASE_RPC_URL: "https://mainnet.base.org"
          EXPO_PUBLIC_MONAD_MAINNET_EXPLORER_URL: "https://monadscan.com"
          EXPO_PUBLIC_NANSEN_PROXY_URL: "https://cherrymoney.co.uk/api/nansen/payment-intelligence/"
        run: npm run web:build
      - name: Consumer browser smoke test (offline, no payments)
        run: |
          python3 -m venv "$RUNNER_TEMP/cherry-browser-venv"
          "$RUNNER_TEMP/cherry-browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/cherry-browser-venv/bin/python" scripts/consumer_browser_smoke.py
      - name: Live graphics component tests (explicit fixtures, not deployed)
        run: |
          mkdir -p build/live-graphics
          "$RUNNER_TEMP/cherry-browser-venv/bin/python" -m playwright install ffmpeg
          # The isolated esbuild entry lacks Metro's module-level global alias.
          npx --no-install esbuild tests/live-graphics.preview.tsx --bundle --platform=browser --jsx=automatic --alias:react-native=react-native-web --define:global=globalThis --define:process.env='{}' --define:process.env.NODE_ENV='"production"' --outfile=build/live-graphics/index.js
          "$RUNNER_TEMP/cherry-browser-venv/bin/python" scripts/live_graphics_browser.py
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: metropolis-web
          path: apps/mobile/dist
          if-no-files-found: error
          include-hidden-files: true
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-browser-check
          path: build/consumer-browser
          if-no-files-found: ignore
      - name: Save isolated graphics test bundle (not a deployable app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-graphics-test-bundle
          path: build/live-graphics
          if-no-files-found: ignore

  consumer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --workspaces --include-workspace-root
      - name: Consumer contracts and policy tests (local chain only)
        run: |
          set -o pipefail
          mkdir -p build
          npm run consumer:test 2>&1 | tee build/consumer-tests.log
      - name: Upload compiled consumer contracts (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: consumer-contracts
          path: build/consumer
          if-no-files-found: error
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-results
          path: build/consumer-tests.log
          if-no-files-found: ignore
