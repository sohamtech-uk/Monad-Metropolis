name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Browser API regression test
        run: node --test tests/browser-fetch.test.mjs

      - name: Consumer contracts and policy tests (local chain only)
        run: npm run consumer:test

      - name: Typecheck
        run: npm run check

      - name: Build Expo web app
        run: npm run web:build

      - name: Consumer browser smoke test (no payments)
        run: node scripts/consumer-browser-smoke.mjs

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: metropolis-web
          path: apps/mobile/dist
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload compiled consumer contracts (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: consumer-contracts
          path: build/consumer
          if-no-files-found: error

      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-browser-check
          path: build/consumer-browser
          if-no-files-found: ignore
