name: Consumer lockfile refresh
on:
  push:
    branches: [feat/consumer-payments-testnet]
    paths: [.github/workflows/consumer-lockfile-once.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumer-payments-testnet
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve dependency metadata without install scripts
        run: npm install --package-lock-only --ignore-scripts --workspaces --include-workspace-root
      - name: Commit lockfile and remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git rm .github/workflows/consumer-lockfile-once.yml
          git commit -m 'chore: lock consumer payment test dependencies'
          gh auth setup-git
          git push origin HEAD:feat/consumer-payments-testnet
