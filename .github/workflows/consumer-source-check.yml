name: Consumer development snapshot
on:
  push:
    branches: [feat/consumer-payments-testnet]
    paths: [.github/workflows/consumer-source-check.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
