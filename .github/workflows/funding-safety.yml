name: Funding safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: funding-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-and-recipient:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --workspaces --include-workspace-root
      - name: Test funding errors, recipient safety and unchanged external-deposit mode
        run: npx --no-install tsx --test tests/funding-safety.test.ts
