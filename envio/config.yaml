# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: cherry-monad-settlement-indexer
description: Cherry Money AUSD settlement intelligence on Monad
disable_default_cross_chain: true

contracts:
  - name: AUSD
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: CherrySettlementRegistry
    events:
      - event: "BusinessPaymentCorrelated(bytes32 indexed paymentReference, bytes32 indexed paymentTxHash, address indexed payer, address recipient, address asset, uint256 amount, uint64 recordedAt)"

chains:
  - id: 10143 # Monad Testnet — first-class HyperSync network in Envio
    # Start just before the funded deployer / registry deployment window.
    # Monad Testnet is currently served via RPC in Envio Development, so avoiding
    # a genesis scan keeps the free deployment practical while still covering
    # every CherrySettlementRegistry event and demo AUSD transfer.
    start_block: 66776000
    contracts:
      - name: AUSD
        address: "0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC"

      # Fixed public trust anchor for the deployed Phase 6 registry.
      # Kept in config so the free Envio Development plan needs no custom env vars.
      - name: CherrySettlementRegistry
        address: "0xdcB418C6e719C40c8e1F9B446cD850330219EEFf"
